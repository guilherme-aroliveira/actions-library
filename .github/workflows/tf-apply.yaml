name: Terraform Apply

on:
  workflow_call:
    inputs:
      work_dir:
        description: "Path of the working directory"
        required: true
        type: string
      tf_version:
        description: "Version of terraform to install"
        required: true
        type: string
      tf_env:
        description: "Deployment environment (prod/dev)"
        required: true
        type: string
      #cloud_provider:
      #  description: "Cloud provider to use"
      #  required: true
      #  type: string
    secrets:
      AWS_ASSUME_ROLE:
        required: false
      AWS_REGION:
        required: false
      AWS_BUCKET_NAME:
        required: false
      AWS_BUCKET_KEY:
        required: false

jobs:

  tf-apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: ${{ inputs.tf_env }}
    env:
      TF_WORKDIR: ${{ inputs.work_dir }}
      TF_VERSION: ${{ inputs.tf_version }}
      TF_VAR_env: ${{ inputs.tf_env }}
    defaults:
      run:
        working-directory: ${{ inputs.work_dir }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Download plan artifact
      uses: actions/download-artifact@v4
      with:
        name: tf-plan-${{ github.sha }}
        path: ${{ inputs.work_dir }}

    - name: Install prerequisites
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        export TZ=America/New_York
        sudo apt-get update -qq
        sudo apt-get install -y -qq git curl unzip ca-certificates jq awscli
        sudo ln -snf "/usr/share/zoneinfo/$TZ" /etc/localtime
        echo "$TZ" | sudo tee /etc/timezone > /dev/null
        sudo dpkg-reconfigure -f noninteractive tzdata

    - name: Set up tfenv (Terraform's version manager)
      run: |
        set -euo pipefail
        git clone --depth=1 https://github.com/tfutils/tfenv.git ~/.tfenv
        echo "$HOME/.tfenv/bin" >> "$GITHUB_PATH"
        echo "tfenv version: $(~/.tfenv/bin/tfenv --version)"

    - name: Install/select Terraform
      run: |
        set -euo pipefail
        tfenv install "$TF_VERSION"
        tfenv use "$TF_VERSION"
        echo "Terraform version: $(terraform version)"

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        aws-region: ${{ secrets.AWS_REGION }}
        role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
        role-session-name: github-actions-${{ github.run_id }}

    - name: Terraform Init
      env:
        AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        AWS_BUCKET_KEY: ${{ secrets.AWS_BUCKET_KEY }}
      run: |
        set -euo pipefail
        terraform init -backend=true \
          -backend-config="bucket=${AWS_BUCKET_NAME}" \
          -backend-config="key=${AWS_BUCKET_KEY}" \
          -backend-config="use_lockfile=true" \
          -backend-config="encrypt=true"

    - name: OpenTofu Apply
      run: |
        set -euo pipefail
        echo "== Deploying infrastructure..."
        tofu apply -input=false -auto-approve tfplan
      continue-on-error: false