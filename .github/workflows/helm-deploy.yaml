name: Helm Deploy

on:
  workflow_call:
    inputs:
      environment: 
        description: "Environment"
        required: true
        type: string
      helm_version:
        description: "Version of helm to install"
        required: true
        type: string
      app:
        description: "Name of the app"
        required: true
        type: string
      namespace:
        required: true
        type: string
    secrets:
      AWS_ASSUME_ROLE:
        required: true
      AWS_REGION:
        required: true

jobs:

  helm-deploy:
    name: Deploy to EKS
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout repository
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        git init -q
        git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git fetch --depth=1 origin "$GITHUB_SHA"
        git checkout -q FETCH_HEAD

    - name: Setup kubectl
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update -qq
        KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
        curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"c
        echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
        chmod +x kubectl
        mkdir -p ~/.local/bin
        mv ./kubectl ~/.local/bin/kubectl
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "kubectl version: $(kubectl version --client)" 

    - name: Install Helm
      env:
        HELM_VERSION: ${{ inputs.helm_version }}
      run: |
        set -euo pipefail
        curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
        curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
        sha256sum --check "helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
        tar -zxf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
        sudo mv linux-amd64/helm /usr/local/bin/helm
        echo "helm version: $(helm version)"

    - name: Configure AWS credentials via OIDC
      env:
        AWS_ASSUME_ROLE: ${{ secrets.AWS_ASSUME_ROLE }}
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID}}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY}}
      run: |
        set -euo pipefail
        echo "Assuming AWS role via OIDC"
        echo "AWS_ASSUME_ROLE is set:" $([ -n "${AWS_ASSUME_ROLE:-}" ] && echo yes || echo no)
        echo "Role account/name: $(echo "$AWS_ASSUME_ROLE" | cut -d: -f5,6)"

        AWS_JWT=$(curl -sSL \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          | jq -r '.value')

        CREDS=$(aws sts assume-role-with-web-identity \
          --role-arn "$AWS_ASSUME_ROLE" \
          --role-session-name "github-actions-${{ github.run_id }}" \
          --web-identity-token "$AWS_JWT" \
          --region "$AWS_REGION" \
          --output json)

        echo "::add-mask::$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')"
        echo "::add-mask::$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')"
        echo "::add-mask::$(echo "$CREDS" | jq -r '.Credentials.SessionToken')"

        echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
        echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"

    - name: Sts GetCallerIdentity
      run: |
        aws sts get-caller-identity

    - name: Configure kubeconfig
      env:
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        set -euo pipefail
        aws eks update-kubeconfig \ 
          --name eks-${{ inputs.environment }}-cluster \ 
          --region ${AWS_REGION}
        echo "List all namespaces..."
        kubectl get ns

    - name: Check Helm Chart (dry-run)
      run: |
        set -euo pipefail
        helm upgrade \ 
          --install ${{ inputs.app }} ./helm-apps/${{ inputs.app }} \ 
          -n ${{ inputs.namespace }} \ 
          --create-namespace \
          --dry-run

    - name: Deploy Helm Chart
      run: |
        set -euo pipefail
        helm upgrade --install ${{ inputs.app }} ./helm-apps/${{ inputs.app }} \
          -n ${{ inputs.namespace }} \ 
          --create-namespace
    
    - name: Validation
      run: |
        set -euo pipefail
        echo "Validating ${{ inputs.app }} deployment..."
        kubectl get all -n ${{ inputs.namespace }}