name: ECR Push

on:
  workflow_call:
    inputs:
      jdk_version:
        description: "The version of JDK to install"
        required: true
        type: string
      ecr_repo:
        description: "ECR repository to use"
        required: true
        type: string
      image_tag:
        description: "Tag for the docker image"
        required: true
        type: string
      folder_name:
        required: true
        type: string      
    secrets:
      AWS_REGION: 
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_ASSUME_ROLE:
        required: true
      ECR_REPOSITORY:
        required: true

jobs:

  ecr-push:
    name: Build & Push Image 
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Install JDK
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update -qq
        sudo apt-get install -y -qq "openjdk-${{ inputs.jdk_version }}-jdk"
        echo "Check for JDK version: $(java --version)"

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        aws-region: ${{ secrets.AWS_REGION }}
        role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
        role-session-name: github-actions-${{ github.run_id }}

    - name: Login to AWS ECR
      env: 
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID}}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        set -euo pipefail
        aws ecr get-login-password \ 
          --region ${AWS_REGION} | docker login \
          --username AWS \
          --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

    - name: Build and tag Docker image
      run: |
        set -euo pipefail
        docker build -t "$REPOSITORY_URI:${{ inputs.image_tag }}" "${{ inputs.folder_name }}"

    - name: Tag Docker Image
      run: |
        set -euo pipefail
        docker tag ${{ inputs.image_tag }} $REPOSITORY_URI:${{ inputs.image_tag }}
    
    - name: Push Docker Image to ECR
      run: |
        set -euo pipefail
        docker push $REPOSITORY_URI:${{ inputs.image_tag }}