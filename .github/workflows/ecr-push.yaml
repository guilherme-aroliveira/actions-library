name: ECR Push

on:
  workflow_call:
    inputs:
      jdk_version:
        description: "The version of JDK to install"
        required: true
        type: string
      ecr_repo:
        description: "ECR repository to use"
        required: true
        type: string
      image_tag:
        description: "Tag for the docker image"
        required: true
        type: string
      folder_name:
        required: true
        type: string      
    secrets:
      AWS_REGION: 
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_ASSUME_ROLE:
        required: true
      ECR_REPOSITORY:
        required: true

jobs:

  ecr-push:
    name: Build & Push Image 
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout repository
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        git init -q
        git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git fetch --depth=1 origin "$GITHUB_SHA"
        git checkout -q FETCH_HEAD
      
    - name: Install JDK
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update -qq
        sudo apt-get install -y -qq "openjdk-${{ inputs.jdk_version }}-jdk"
        echo "Check for JDK version: $(java --version)"

    - name: Configure AWS credentials via OIDC
      env:
        AWS_ASSUME_ROLE: ${{ secrets.AWS_ASSUME_ROLE }}
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID}}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY}}
      run: |
        set -euo pipefail
        echo "Assuming AWS role via OIDC"
        echo "AWS_ASSUME_ROLE is set:" $([ -n "${AWS_ASSUME_ROLE:-}" ] && echo yes || echo no)
        echo "Role account/name: $(echo "$AWS_ASSUME_ROLE" | cut -d: -f5,6)"

        AWS_JWT=$(curl -sSL \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          | jq -r '.value')

        CREDS=$(aws sts assume-role-with-web-identity \
          --role-arn "$AWS_ASSUME_ROLE" \
          --role-session-name "github-actions-${{ github.run_id }}" \
          --web-identity-token "$AWS_JWT" \
          --region "$AWS_REGION" \
          --output json)

        echo "::add-mask::$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')"
        echo "::add-mask::$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')"
        echo "::add-mask::$(echo "$CREDS" | jq -r '.Credentials.SessionToken')"

        echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
        echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"
        echo "REPOSITORY_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}" >> "$GITHUB_ENV"

    - name: Sts GetCallerIdentity
      run: |
        aws sts get-caller-identity

    - name: Login to AWS ECR
      env: 
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID}}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        set -euo pipefail
        aws ecr get-login-password \ 
          --region ${AWS_REGION} | docker login \
          --username AWS \
          --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

    - name: Build and tag Docker image
      run: |
        set -euo pipefail
        docker build -t "$REPOSITORY_URI:${{ inputs.image_tag }}" "${{ inputs.folder_name }}"

    - name: Tag Docker Image
      run: |
        set -euo pipefail
        docker tag ${{ inputs.image_tag }} $REPOSITORY_URI:${{ inputs.image_tag }}
    
    - name: Push Docker Image to ECR
      run: |
        set -euo pipefail
        docker push $REPOSITORY_URI:${{ inputs.image_tag }}