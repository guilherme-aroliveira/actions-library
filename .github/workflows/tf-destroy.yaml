name: Terraform Destroy

on:
  workflow_call:
    inputs:
      work_dir:
        description: "Path of the working directory"
        required: true
        type: string
      tf_version:
        description: "Version of terraform to install"
        required: true
        type: string
      tf_env:
        description: "Deployment environment (prod/dev)"
        required: true
        type: string
      #cloud_provider:
      #  description: "Cloud provider to use"
      #  required: true
      #  type: string
    secrets:
      AWS_ASSUME_ROLE:
        required: false
      AWS_REGION:
        required: false
      AWS_BUCKET_NAME:
        required: false
      AWS_BUCKET_KEY:
        required: false

jobs:

  tf-destroy:
    name: Terraform Destroy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    environment: ${{ inputs.tf_env }}
    env:
      TF_WORKDIR: ${{ inputs.work_dir }}
      TF_VERSION: ${{ inputs.tf_version }}
    defaults:
      run:
        working-directory: ${{ inputs.work_dir }}

    steps:

    - name: Checkout repository
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        git init -q
        git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git fetch --depth=1 origin "$GITHUB_SHA"
        git checkout -q FETCH_HEAD

    - name: Install prerequisites
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        export TZ=America/New_York
        sudo apt-get update -qq
        sudo apt-get install -y -qq git curl unzip ca-certificates jq awscli
        sudo ln -snf "/usr/share/zoneinfo/$TZ" /etc/localtime
        echo "$TZ" | sudo tee /etc/timezone > /dev/null
        sudo dpkg-reconfigure -f noninteractive tzdata

    - name: Set up tfenv (Terraform's version manager)
      run: |
        set -euo pipefail
        git clone --depth=1 https://github.com/tfutils/tfenv.git ~/.tfenv
        echo "$HOME/.tfenv/bin" >> "$GITHUB_PATH"
        echo "tfenv version: $(~/.tfenv/bin/tfenv --version)"

    - name: Install/select Terraform
      run: |
        set -euo pipefail
        tfenv install "$TF_VERSION"
        tfenv use "$TF_VERSION"
        echo "Terraform version: $(terraform version)"

    - name: Configure AWS credentials via OIDC
      env:
        AWS_ASSUME_ROLE: ${{ secrets.AWS_ASSUME_ROLE }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        set -euo pipefail
        echo "Assuming AWS role via OIDC"
        echo "AWS_ASSUME_ROLE is set:" $([ -n "${AWS_ASSUME_ROLE:-}" ] && echo yes || echo no)
        echo "Role account/name: $(echo "$AWS_ASSUME_ROLE" | cut -d: -f5,6)"

        AWS_JWT=$(curl -sSL \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          | jq -r '.value')
 
        CREDS=$(aws sts assume-role-with-web-identity \
          --role-arn "$AWS_ASSUME_ROLE" \
          --role-session-name "github-actions-${{ github.run_id }}" \
          --web-identity-token "$AWS_JWT" \
          --region "$AWS_REGION" \
          --output json)
 
        echo "::add-mask::$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')"
        echo "::add-mask::$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')"
        echo "::add-mask::$(echo "$CREDS" | jq -r '.Credentials.SessionToken')"
 
        echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
        echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"

    - name: Sts GetCallerIdentity
      run: |
        aws sts get-caller-identity

    - name: Terraform Init
      env:
        AWS_REGION: ${{ secrets.AWS_REGION}}
        AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        AWS_BUCKET_KEY: ${{ secrets.AWS_BUCKET_KEY }}
      run: |
        set -euo pipefail
        terraform init -backend=true \
          -backend-config="bucket=${AWS_BUCKET_NAME}" \
          -backend-config="key=${AWS_BUCKET_KEY}" \
          -backend-config="region=${AWS_REGION}" \
          -backend-config="use_lockfile=true" \
          -backend-config="encrypt=true"

    - name: Terraform Destroy
      if: github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        echo "== Destroying infrastructure..."
        terraform destroy -auto-approve
      continue-on-error: false