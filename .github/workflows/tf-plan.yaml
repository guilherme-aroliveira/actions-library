name: Terraform Plan

on:
  workflow_call:
    inputs:
      work_dir:
        description: "Path of the working directory"
        required: true
        type: string
      tf_version:
        description: "Version of terraform to install"
        required: true
        type: string
      tf_env:
        description: "Deployment environment (prod/dev)"
        required: true
        type: string
      #cloud_provider:
      #  description: "Cloud provider to use"
      #  required: true
      #  type: string
    secrets:
      AWS_ASSUME_ROLE:
        required: false
      AWS_REGION:
        required: false
      AWS_BUCKET_NAME:
        required: false
      AWS_BUCKET_KEY:
        required: false

jobs:

  tf-plan:
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') || 
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    environment: ${{ inputs.tf_env }}
    env:
      TF_WORKDIR: ${{ inputs.work_dir }}
      TF_VERSION: ${{ inputs.tf_version }}
    defaults:
      run:
        working-directory: ${{ inputs.work_dir }}

    steps:
    
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install prerequisites
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        export TZ=America/New_York
        sudo apt-get update -qq
        sudo apt-get install -y -qq git curl unzip ca-certificates jq awscli
        sudo ln -snf "/usr/share/zoneinfo/$TZ" /etc/localtime
        echo "$TZ" | sudo tee /etc/timezone > /dev/null
        sudo dpkg-reconfigure -f noninteractive tzdata

    - name: Set up tfenv (Terraform's version manager)
      run: |
        set -euo pipefail
        git clone --depth=1 https://github.com/tfutils/tfenv.git ~/.tfenv
        ln -s ~/.tfenv/bin/* /usr/local/bin
        mkdir -p ~/.local/bin/
        . ~/.profile
        ln -s ~/.tfenv/bin/* /usr/local/bin
        echo "tfenv location $(which tfenv)"
        echo "tfenv version $(tfenv --version)"

    - name: Install/select Terraform
      run: |
        set -euo pipefail
        tfenv install "$TF_VERSION"
        tfenv use "$TF_VERSION"
        echo "Terraform version $(terraform version)"

    - name: Configure AWS credentials via OIDC
      env:
        AWS_ASSUME_ROLE: ${{ secrets.AWS_ASSUME_ROLE }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        set -euo pipefail
        echo "Assuming AWS role via OIDC"
        echo "AWS_ASSUME_ROLE is set:" $([ -n "${AWS_ASSUME_ROLE:-}" ] && echo yes || echo no)
        AWS_JWT=$(curl -sSL \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          | jq -r '.value')

        CREDS=$(aws sts assume-role-with-web-identity \
          --role-arn "$AWS_ASSUME_ROLE" \
          --role-session-name "github-actions-${{ github.run_id }}" \
          --web-identity-token "$AWS_JWT" \
          --region "$AWS_REGION" \
          --output json)

        echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
        echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"

    - name: Terraform Init
      env:
        AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        AWS_BUCKET_KEY: ${{ secrets.AWS_BUCKET_KEY }}
      run: |
        set -euo pipefail
        terraform init -backend=true \
          -backend-config="bucket=${AWS_BUCKET_NAME}" \
          -backend-config="key=${AWS_BUCKET_KEY}" \
          -backend-config="use_lockfile=true" \
          -backend-config="encrypt=true"
      continue-on-error: false

    - name: Terraform Plan
      run: |
        set -euo pipefail
        echo "== Generating execution plan..."
        terraform plan -input=false -out=tfplan
      continue-on-error: false

    - name: Upload plan artifact
      uses: actions/upload-artifact@v7
      with:
        name: tf-plan-${{ github.sha }}
        retention-days: 1
        path: $TF_WORKDIR/tfplan