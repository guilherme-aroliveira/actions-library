name: Terraform Plan

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path of the working directory"
        required: true
        type: string
      tf_version:
        description: "Version of terraform to install"
        required: true
        type: string
      cloud_provider:
        description: "Cloud provider to use (aws, azure, gcp, or none)"
        required: true
        type: string
    secrets:
      # AWS
      AWS_ASSUME_ROLE:
        required: false
      AWS_REGION:
        required: false
      AWS_BUCKET_NAME:
        required: false
      AWS_BUCKET_KEY:
        required: false
      S3_LOCK:
        required: false

jobs:

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
    
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up tfenv
      run: |
        git clone --depth=1 https://github.com/tfutils/tfenv.git ~/.tfenv
        ln -s ~/.tfenv/bin/* /usr/local/bin
        mkdir -p ~/.local/bin/
        . ~/.profile
        ln -s ~/.tfenv/bin/* ~/.local/bin
        echo "tvenf location $(which tfenv)"
        echo "tfenv version $(tfenv --version)"

    - name: Set up terraform
      run: |
        tfenv install ${{ inputs.tf_version }}
        tfenv use ${{ inputs.tf_version }}
        tfVersion=$(terraform version)
        echo "terraform version: $tfVersion"

    - name: Configure AWS credentials
      id: configure_aws_credentials
      if: ${{ inputs.cloud_provider == 'aws' }}
      env:
        aws-region: ${{ secrets.AWS_REGION }}
        aws-assume-role: ${{ secrets.AWS_ASSUME_ROLE }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.aws-assume-role }}
        aws-region: ${{ env.aws-region }}

    - name: Terraform Init
      env:
        aws_region: ${{ secrets.AWS_REGION }}
        aws_bucket_name: ${{ secrets.AWS_BUCKET_NAME }}
        aws_bucket_key: ${{ secrets.AWS_BUCKET_KEY }}
        s3_locking: ${{ secrets.S3_LOCK }}
      run: |
        terraform init -backend=true \
          -backend-config="bucket=${aws_bucket_name}" \
          -backend-config="key=${aws_bucket_key}" \
          -backend-config="use_lockfile=${s3_locking}" \
          -backend-config="encrypt=true"
      continue-on-error: false

    - name: Terraform Plan
      id: plan
      run: |
        terraform plan -input=false 
      continue-on-error: false
