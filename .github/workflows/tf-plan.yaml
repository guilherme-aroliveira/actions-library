name: Terraform Plan

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path of the working directory"
        required: true
        type: string
      tf_version:
        description: "Version of terraform to install"
        required: true
        type: string
      cloud_provider:
        description: "Cloud provider to use (aws, azure, gcp, or none)"
        required: true
        type: string
      init_backend:
        description: "Whether to enable Terraform backend (true/false)"
        required: false
        type: boolean
      backend_config_args:
        description: "Additional backend config args for terraform init (optional)"
        required: false
        type: string
        default: ""
      plan_lock:
        description: "Whether to enable state locking for plan (true/false)"
        required: false
        type: boolean
      plan_refresh:
        description: "Whether to refresh state during plan (true/false)"
        required: false
        type: boolean
    secrets:
      # AWS
      AWS_ASSUME_ROLE:
        required: false
      AWS_REGION:
        required: false
      AWS_BUCKET_NAME:
        required: false
      AWS_BUCKET_KEY:
        required: false
      S3_LOCK:
        required: false

jobs:

  checkout:
    uses: ./.github/workflows/checkout.yaml

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/checkout-source/${{ inputs.working_directory }}

    steps:
    - name: Download source artifact
      uses: actions/download-artifact@v4
      with:
        name: checkout-source
        path: ${{ github.workspace }}/checkout-source

    - name: Set up tfenv
      run: |
        git clone --depth=1 https://github.com/tfutils/tfenv.git ~/.tfenv
        ln -s ~/.tfenv/bin/* /usr/local/bin
        mkdir -p ~/.local/bin/
        . ~/.profile
        ln -s ~/.tfenv/bin/* ~/.local/bin
        echo "tvenf location $(which tfenv)"
        echo "tfenv version $(tfenv --version)"

    - name: Set up terraform
      run: |
        tfenv install ${{ inputs.tf_version }}
        tfenv use ${{ inputs.tf_version }}
        tfVersion=$(terraform version)
        echo "terraform version: $tfVersion"

    - name: Configure AWS credentials
      id: configure_aws_credentials
      if: ${{ inputs.cloud_provider == 'aws' }}
      env:
        aws-region: ${{ secrets.AWS_REGION }}
        aws-assume-role: ${{ secrets.AWS_ASSUME_ROLE }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.aws-assume-role }}
        aws-region: ${{ env.aws-region }}

    - name: Terraform Init
      run: terraform init -backend=${{ inputs.init_backend }} ${{ inputs.backend_config_args }}
      continue-on-error: false

    - name: Terraform Plan
      id: plan
      run: |
        terraform plan \
          -lock=${{ inputs.plan_lock }} \
          -input=false \
          -refresh=${{ inputs.plan_refresh }}
      continue-on-error: false
