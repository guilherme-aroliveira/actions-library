name: Terraform Test

on:
  workflow_call:
    inputs:
      work_dir:
        description: "Path of the working directory"
        required: true
        type: string
      tf_version:
        description: "Version of terraform to install"
        required: true
        type: string
      modules_dir:
        description: "Path to the modules directory"
        required: true
        type: string

jobs:

  tf-test:
    name: Terraform Test
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-22.04
    env:
      TF_WORKDIR: ${{ inputs.work_dir }}
      TF_VERSION: ${{ inputs.tf_version }}
      MODULES_DIR: "${{ inputs.modules_dir }}"
    defaults:
      run:
        working-directory: ${{ inputs.work_dir }}
        
    steps:
    
    - name: Checkout repository
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        git init -q
        git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git fetch --depth=1 origin "$GITHUB_SHA"
        git checkout -q FETCH_HEAD

    - name: Install prerequisites
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq git curl unzip ca-certificates

    - name: Set up tfenv (Terraform's version manager)
      run: |
        set -euo pipefail
        git clone --depth=1 https://github.com/tfutils/tfenv.git ~/.tfenv
        echo "$HOME/.tfenv/bin" >> "$GITHUB_PATH"
        echo "tfenv version: $(~/.tfenv/bin/tfenv --version)"

    - name: Install/select Terraform
      run: |
        set -euo pipefail
        tfenv install "$TF_VERSION"
        tfenv use "$TF_VERSION"
        echo "Terraform version: $(terraform version)"

    - name: Terraform Init (no backend)
      run: |
        set -euo pipefail
        terraform init -backend=false -input=false

    - name: Terraform Test
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/$MODULES_DIR"
        for module_dir in */; do
          module_name="${module_dir%/}"
          if [ -d "${module_dir}tests" ] || ls "${module_dir}"*.tftest.hcl >/dev/null 2>&1; then
            echo "== Testing module: $module_name"
            (
              cd "$GITHUB_WORKSPACE/$MODULES_DIR/$module_dir"
              terraform init -backend=false -input=false
              terraform test -verbose
            )
          else
            echo "== No tests found in module: $module_name, skipping"
          fi
        done
      continue-on-error: false